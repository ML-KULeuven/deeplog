
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  GIT_DEPTH: "0"
  GIT_CLONE_PATH: '$CI_BUILDS_DIR/$CI_PROJECT_NAME/job_$CI_JOB_ID'
  GITHUB_MIRROR_REPOSITORY: "ML-KULeuven/deeplog"
  # Where the notebooks keep the datasets they download. The datasets cache
  # keeps it between jobs, so a slow mirror costs one download, not one per job.
  DEEPLOG_DATA_DIR: "$CI_PROJECT_DIR/.datasets"

# Shared with merge request pipelines, which otherwise get a cache of their own
# and download again; what it holds is public data torchvision checksums.
.datasets: &datasets
  key: datasets
  unprotect: true
  paths:
    - .datasets

# The .pre stage runs before every job without `needs`; a release job with
# `needs` skips the stage order, so it lists this job among them.
check_version:
  stage: .pre
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.].+)?$/'
      when: on_success
    - when: never
  script:
    - |
      python - <<'EOF'
      import os
      import tomllib
      import urllib.error
      import urllib.request

      from packaging.version import Version

      tag = os.environ["CI_COMMIT_TAG"]
      with open("pyproject.toml", "rb") as f:
          project = tomllib.load(f)["project"]
      version = Version(project["version"])
      if Version(tag.removeprefix("v")) != version:
          raise SystemExit(f"Tag {tag} does not match version {project['version']} in pyproject.toml.")
      try:
          urllib.request.urlopen(f"https://pypi.org/pypi/{project['name']}/{version}/json")
      except urllib.error.HTTPError as error:
          if error.code != 404:
              raise
      else:
          raise SystemExit(f"Version {version} is already on PyPI; release the change as a new version.")
      EOF

# Every job runs on the group's runner, dtai/deeplog/ci-runner, tagged
# deeplog-ci. It carries no Python packages, so every job installs DeepLog, with
# all its extras, into an environment of its own.
default:
  tags: [deeplog-ci]
  before_script:
    - uv venv .venv
    - source .venv/bin/activate
    - uv pip install -e ".[dev,examples,janus_engine,site,tests]"

lint:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - nbstripout --verify examples/**/*.ipynb
    - ruff check .
    - ruff format --check .

typecheck:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pyright src

test_code:
  needs:
    - job: lint
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - changes:
        paths:
          - src/**/*
          - tests/**/*
          - pyproject.toml
          - .gitlab-ci.yml
  script:
    - pytest --cov=src --cov-report term --cov-report xml:coverage.xml tests/
  coverage: '/TOTAL.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_notebooks:
  needs:
    - job: lint
  parallel:
    matrix:
      - NOTEBOOK: [symbol, shape, deeplogmodule, composition, language, formula_to_module, semantic_loss, problog, deepproblog, predicates, circuits, "01_aggregation_basics", "03_free_variables_and_batching", ltn, circuit_transformation]
  # Concurrent matrix jobs sharing a host race for ZMQ ports, so kernel startup
  # occasionally fails with "Address already in use" / "Kernel didn't respond".
  # The failure is transient, so retry the job rather than fail the pipeline.
  retry:
    max: 2
    when:
      - script_failure
      - stuck_or_timeout_failure
      - runner_system_failure
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - changes:
        paths:
          - src/**/*
          - examples/$NOTEBOOK/**/*
          - pyproject.toml
          - .gitlab-ci.yml
  cache: *datasets
  # A cell that runs past the timeout fails the job, where a stalled download
  # would otherwise hold it until the job's own limit.
  script:
    - DEEPLOG_FAST_DEV_RUN=1 jupyter nbconvert --to notebook --inplace --execute --ExecutePreprocessor.timeout=600 examples/$NOTEBOOK/*.ipynb
  artifacts:
    paths:
      - examples/$NOTEBOOK/


mirror_github_release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.].+)?$/'
      when: on_success
    - when: never
  needs:
    - job: check_version
    - job: deploy_static_site
      optional: true
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH" --tags
    - DEFAULT_BRANCH_SHA="$(git rev-parse "origin/$CI_DEFAULT_BRANCH")"
    - |
      if [ -z "$GITHUB_MIRROR_TOKEN" ]; then
        echo "GITHUB_MIRROR_TOKEN is required to mirror tagged releases to GitHub."
        exit 1
      fi
    - |
      if [ "$DEFAULT_BRANCH_SHA" != "$CI_COMMIT_SHA" ]; then
        echo "Refusing to mirror: tag $CI_COMMIT_TAG is not at the tip of $CI_DEFAULT_BRANCH."
        exit 1
      fi
    - git config user.email "gitlab-ci@kuleuven.be"
    - git config user.name "GitLab CI"
    - git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPOSITORY}.git"
    # GitHub holds one commit per release, each on the previous release's. When
    # GitHub's latest commit already carries this release's tag, it is an earlier
    # attempt at this release, and the new commit replaces it.
    - git fetch github "$CI_DEFAULT_BRANCH" || true
    - GITHUB_HEAD=$(git rev-parse -q --verify "github/$CI_DEFAULT_BRANCH" || true)
    - GITHUB_TAGGED=$(git ls-remote github "refs/tags/${CI_COMMIT_TAG}" | cut -f1)
    - PARENT="$GITHUB_HEAD"
    - |
      if [ -n "$GITHUB_HEAD" ] && [ "$GITHUB_TAGGED" = "$GITHUB_HEAD" ]; then
        PARENT=$(git rev-parse -q --verify "${GITHUB_HEAD}^" || true)
      fi
    - TREE=$(git rev-parse "HEAD^{tree}")
    - SQUASHED=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "Release $CI_COMMIT_TAG")
    # Atomic, so the branch and the tag always move together: the check above
    # relies on the tag naming GitHub's latest commit.
    - |
      git push --atomic \
        --force-with-lease="refs/heads/${CI_DEFAULT_BRANCH}:${GITHUB_HEAD}" \
        github \
        "${SQUASHED}:refs/heads/${CI_DEFAULT_BRANCH}" \
        "+${SQUASHED}:refs/tags/${CI_COMMIT_TAG}"

build_docs:
  needs:
    - job: test_notebooks
      optional: true
  variables:
    NB_EXECUTION_TIMEOUT: "600"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths:
          - src/**/*
          - site/**/*
          - docs/**/*
          - examples/**/*
          - pyproject.toml
          - .gitlab-ci.yml
          - README.md
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - src/**/*
          - site/**/*
          - docs/**/*
          - examples/**/*
          - pyproject.toml
          - .gitlab-ci.yml
          - README.md
      # A merge request's docs are checked, never published, and test_notebooks
      # runs its notebooks, so the build renders them without executing them.
      variables:
        NB_EXECUTION_MODE: "off"
  cache:
    - key: "docs-$CI_COMMIT_REF_SLUG"
      policy: pull-push
      paths:
        - site/build
    - *datasets
  script:
    - rm -rf public
    - sphinx-build -W -n -D html_baseurl="${CI_PAGES_URL:-}" site/source/ public
  artifacts:
    paths:
      - public

deploy_static_site:
  needs:
    - job: check_version
    - job: test_notebooks
      optional: true
  variables:
    NB_EXECUTION_TIMEOUT: "600"
    DOCS_BASE_URL: "https://dtai.cs.kuleuven.be/deeplog"
    STATIC_SITE_DIR: "/static_site"
    SMV_TAG_WHITELIST: "^${CI_COMMIT_TAG}$"
    SMV_BRANCH_WHITELIST: "^$"
    SMV_REMOTE_WHITELIST: "^origin$"
    SMV_RELEASED_PATTERN: "^tags/.*$"
    SMV_OUTPUTDIR_FORMAT: "{ref.name}"
    SMV_ROOT_REF: "${CI_COMMIT_TAG}"
    SMV_PREFER_REMOTE_REFS: "true"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.].+)?$/'
      when: on_success
    - when: never
  cache:
    - key: "docs-$CI_COMMIT_REF_SLUG"
      policy: pull-push
      paths:
        - site/build
    - *datasets
  script:
    - |
      if [ ! -d "$STATIC_SITE_DIR" ]; then
        echo "Expected mounted static site directory at $STATIC_SITE_DIR, but it does not exist."
        exit 1
      fi
    - rm -rf site/build/html
    - DOCS_BASE_URL="${DOCS_BASE_URL:-}" make -C site multiversion
    - |
      if [ ! -d "site/build/html/${CI_COMMIT_TAG}" ]; then
        echo "Expected the docs of ${CI_COMMIT_TAG} at site/build/html/${CI_COMMIT_TAG}, but they were not built."
        exit 1
      fi
    # Build state, regenerable and half the output's size, is not published.
    - rm -rf "site/build/html/${CI_COMMIT_TAG}/.doctrees"
    # Only this release's docs can be built: sphinx-multiversion builds every
    # version's sources against the one installed package. So the site keeps the
    # directory each release published and this job adds its own, replacing only
    # the copy of the newest release that the root serves.
    - rm -rf "${STATIC_SITE_DIR:?}/${CI_COMMIT_TAG}"
    - cp -a "site/build/html/${CI_COMMIT_TAG}" "${STATIC_SITE_DIR}/${CI_COMMIT_TAG}"
    - find "$STATIC_SITE_DIR" -mindepth 1 -maxdepth 1 ! -name 'v[0-9]*' -exec rm -rf {} +
    - cp -a "site/build/html/${CI_COMMIT_TAG}/." "$STATIC_SITE_DIR/"
    - python site/rewrite_switcher.py
    - test -f "$STATIC_SITE_DIR/index.html"

pages:
  needs:
    - job: build_docs
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths:
          - src/**/*
          - site/**/*
          - docs/**/*
          - examples/**/*
          - pyproject.toml
          - .gitlab-ci.yml
          - README.md
  script:
    - echo "Publishing docs to GitLab Pages"
  artifacts:
    paths:
      - public
