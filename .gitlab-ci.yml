
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  GIT_DEPTH: "0"
  GIT_CLONE_PATH: '$CI_BUILDS_DIR/$CI_PROJECT_NAME/job_$CI_JOB_ID'
  PYTHONPATH: "$CI_PROJECT_DIR/src"
  GITHUB_MIRROR_REPOSITORY: "ML-KULeuven/deeplog"

update_env:
  script:
    - uv pip install -r requirements.txt

lint:
  needs:
    - job: update_env
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - nbstripout --verify examples/**/*.ipynb
    - ruff check .
    - ruff format --check .


image: "registry.gitlab.kuleuven.be/dtai/deeplog/deeplog:cpu"

typecheck:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pyright src

test_code:
  needs:
    - job: lint
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - changes:
        paths:
          - requirements.txt
          - Dockerfile
    - changes:
        paths:
          - src/**/*
          - tests/**/*
          - pyproject.toml
  script:
    - pytest --cov=src --cov-report term --cov-report xml:coverage.xml tests/
  coverage: '/TOTAL.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_notebooks:
  needs:
    - job: lint
  parallel:
    matrix:
      - NOTEBOOK: [symbol, shape, deeplogmodule, composition, language, formula_to_module, semantic_loss, problog, deepproblog, predicates, circuits, "01_aggregation_basics", "03_free_variables_and_batching", ltn, circuit_transformation]
  # Concurrent matrix jobs sharing a host race for ZMQ ports, so kernel startup
  # occasionally fails with "Address already in use" / "Kernel didn't respond".
  # The failure is transient, so retry the job rather than fail the pipeline.
  retry:
    max: 2
    when:
      - script_failure
      - stuck_or_timeout_failure
      - runner_system_failure
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - changes:
        paths:
          - requirements.txt
          - Dockerfile
    - changes:
        paths:
          - src/**/*
          - examples/$NOTEBOOK/**/*
          - pyproject.toml
  script:
    - DEELOG_FAST_DEV_RUN=1 jupyter nbconvert --to notebook --inplace --execute examples/$NOTEBOOK/*.ipynb
  artifacts:
    paths:
      - examples/$NOTEBOOK/


mirror_github_release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.].+)?$/'
      when: on_success
    - when: never
  needs:
    - job: deploy_static_site
      optional: true
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH" --tags
    - DEFAULT_BRANCH_SHA="$(git rev-parse "origin/$CI_DEFAULT_BRANCH")"
    - |
      if [ -z "$GITHUB_MIRROR_TOKEN" ]; then
        echo "GITHUB_MIRROR_TOKEN is required to mirror tagged releases to GitHub."
        exit 1
      fi
    - |
      if [ "$DEFAULT_BRANCH_SHA" != "$CI_COMMIT_SHA" ]; then
        echo "Refusing to mirror: tag $CI_COMMIT_TAG is not at the tip of $CI_DEFAULT_BRANCH."
        exit 1
      fi
    - git config user.email "gitlab-ci@kuleuven.be"
    - git config user.name "GitLab CI"
    - git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPOSITORY}.git"
    # Fetch GitHub's current state so we can parent the squashed commit onto it.
    - git fetch github "$CI_DEFAULT_BRANCH" || true
    - GITHUB_HEAD=$(git rev-parse "github/$CI_DEFAULT_BRANCH" 2>/dev/null || echo "")
    - TREE=$(git rev-parse "HEAD^{tree}")
    - |
      if [ -n "$GITHUB_HEAD" ]; then
        SQUASHED=$(git commit-tree "$TREE" -p "$GITHUB_HEAD" -m "Release $CI_COMMIT_TAG")
      else
        SQUASHED=$(git commit-tree "$TREE" -m "Release $CI_COMMIT_TAG")
      fi
    - git push github "${SQUASHED}:refs/heads/${CI_DEFAULT_BRANCH}"
    - git tag -f "$CI_COMMIT_TAG" "$SQUASHED"
    - git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}" --force

build_docs:
  needs:
    - job: test_notebooks
      optional: true
  variables:
    NB_EXECUTION_TIMEOUT: "600"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths:
          - src/**/*
          - site/**/*
          - docs/**/*
          - examples/**/*
          - pyproject.toml
          - README.md
          - requirements.txt
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - src/**/*
          - site/**/*
          - docs/**/*
          - examples/**/*
          - pyproject.toml
          - README.md
          - requirements.txt
  cache:
    key: "docs-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - site/build
  script:
    - rm -rf public
    - sphinx-build -W -n -D html_baseurl="${CI_PAGES_URL:-}" site/source/ public
  artifacts:
    paths:
      - public

deploy_static_site:
  needs:
    - job: test_notebooks
      optional: true
  variables:
    NB_EXECUTION_TIMEOUT: "600"
    DOCS_BASE_URL: "https://dtai.cs.kuleuven.be/deeplog"
    STATIC_SITE_DIR: "/static_site"
    SMV_TAG_WHITELIST: "^${CI_COMMIT_TAG}$"
    SMV_BRANCH_WHITELIST: "^$"
    SMV_REMOTE_WHITELIST: "^origin$"
    SMV_RELEASED_PATTERN: "^tags/.*$"
    SMV_OUTPUTDIR_FORMAT: "{ref.name}"
    SMV_ROOT_REF: "${CI_COMMIT_TAG}"
    SMV_PREFER_REMOTE_REFS: "true"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.].+)?$/'
      when: on_success
    - when: never
  cache:
    key: "docs-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - site/build
  script:
    - |
      if [ ! -d "$STATIC_SITE_DIR" ]; then
        echo "Expected mounted static site directory at $STATIC_SITE_DIR, but it does not exist."
        exit 1
      fi
    - rm -rf site/build/html
    - DOCS_BASE_URL="${DOCS_BASE_URL:-}" make -C site multiversion
    - |
      if [ ! -d "site/build/html/${CI_COMMIT_TAG}" ]; then
        echo "Expected the docs of ${CI_COMMIT_TAG} at site/build/html/${CI_COMMIT_TAG}, but they were not built."
        exit 1
      fi
    # Build state, regenerable and half the output's size, is not published.
    - rm -rf "site/build/html/${CI_COMMIT_TAG}/.doctrees"
    # Only this release's docs can be built: sphinx-multiversion builds every
    # version's sources against the one installed package. So the site keeps the
    # directory each release published and this job adds its own, replacing only
    # the copy of the newest release that the root serves.
    - rm -rf "${STATIC_SITE_DIR:?}/${CI_COMMIT_TAG}"
    - cp -a "site/build/html/${CI_COMMIT_TAG}" "${STATIC_SITE_DIR}/${CI_COMMIT_TAG}"
    - find "$STATIC_SITE_DIR" -mindepth 1 -maxdepth 1 ! -name 'v[0-9]*' -exec rm -rf {} +
    - cp -a "site/build/html/${CI_COMMIT_TAG}/." "$STATIC_SITE_DIR/"
    - python site/rewrite_switcher.py
    - test -f "$STATIC_SITE_DIR/index.html"

pages:
  needs:
    - job: build_docs
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths:
          - src/**/*
          - site/**/*
          - docs/**/*
          - examples/**/*
          - pyproject.toml
          - README.md
          - requirements.txt
  script:
    - echo "Publishing docs to GitLab Pages"
  artifacts:
    paths:
      - public
