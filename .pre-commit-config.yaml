repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        # Resolve the pythonPath from whichever `python` is on PATH at commit
        # time (i.e. the active venv/conda env). pyright otherwise prefers
        # `python3`, which on macOS often points at a system Python without
        # the project's dependencies.
        entry: bash -c 'pyright --pythonpath "$(command -v python)" src'
        language: system
        types: [python]
        pass_filenames: false
